<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ROS 2 vision-guided manipulator architecture</title>
  <desc id="desc">Flow from RGB-D perception through task orchestration and MoveIt planning to a gated controller.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17233b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#79c7ff"/></marker>
    <style>.title{font:700 28px system-ui;fill:#f8fbff}.sub{font:400 15px system-ui;fill:#9fb0c7}.label{font:700 17px system-ui;fill:#fff}.small{font:400 13px system-ui;fill:#c8d4e3}.box{stroke-width:2;rx:16;filter:url(#shadow)}.line{stroke:#79c7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">Vision-guided pick-and-place — software boundaries</text>
  <text x="54" y="86" class="sub">Perception estimates; policy selects; MoveIt plans; execution remains explicitly gated.</text>
  <g transform="translate(50 145)"><rect class="box" width="190" height="112" fill="#173c55" stroke="#39a9db"/><text x="95" y="42" text-anchor="middle" class="label">RGB-D camera</text><text x="95" y="69" text-anchor="middle" class="small">colour + aligned depth</text><text x="95" y="90" text-anchor="middle" class="small">camera intrinsics</text></g>
  <g transform="translate(300 145)"><rect class="box" width="190" height="112" fill="#263b66" stroke="#7699ff"/><text x="95" y="42" text-anchor="middle" class="label">Pose estimator</text><text x="95" y="69" text-anchor="middle" class="small">filter + project to 3D</text><text x="95" y="90" text-anchor="middle" class="small">pose + covariance</text></g>
  <g transform="translate(550 145)"><rect class="box" width="190" height="112" fill="#443268" stroke="#bd8cff"/><text x="95" y="42" text-anchor="middle" class="label">Task manager</text><text x="95" y="69" text-anchor="middle" class="small">class/confidence policy</text><text x="95" y="90" text-anchor="middle" class="small">deterministic lifecycle</text></g>
  <g transform="translate(800 145)"><rect class="box" width="190" height="112" fill="#55324b" stroke="#ff88bd"/><text x="95" y="42" text-anchor="middle" class="label">Motion server</text><text x="95" y="69" text-anchor="middle" class="small">workspace validation</text><text x="95" y="90" text-anchor="middle" class="small">plan / execute gate</text></g>
  <path class="line" d="M240 201 H292"/><path class="line" d="M490 201 H542"/><path class="line" d="M740 201 H792"/>
  <g transform="translate(674 360)"><rect class="box" width="200" height="112" fill="#24483f" stroke="#57d6b0"/><text x="100" y="42" text-anchor="middle" class="label">MoveIt 2 + OMPL</text><text x="100" y="69" text-anchor="middle" class="small">planning scene</text><text x="100" y="90" text-anchor="middle" class="small">collision-checked paths</text></g>
  <g transform="translate(950 360)"><rect class="box" width="200" height="112" fill="#554526" stroke="#f3c969"/><text x="100" y="42" text-anchor="middle" class="label">Controller / arm</text><text x="100" y="69" text-anchor="middle" class="small">ros2_control boundary</text><text x="100" y="90" text-anchor="middle" class="small">disabled by default</text></g>
  <path class="line" d="M895 257 V317 H774 V352"/><path class="line" d="M874 416 H942"/>
  <g transform="translate(50 350)"><rect width="510" height="140" rx="16" fill="#111c30" stroke="#34445f"/><text x="24" y="34" class="label">Fail-safe application rules</text><text x="24" y="66" class="small">• reject missing depth, low confidence, and invalid dimensions</text><text x="24" y="91" class="small">• reject targets outside the configured workspace</text><text x="24" y="116" class="small">• require both request and node configuration to permit execution</text></g>
</svg>

