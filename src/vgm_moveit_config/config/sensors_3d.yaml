sensors:
  - depth_camera

depth_camera:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/points
  max_range: 2.5
  point_subsample: 2
  padding_offset: 0.02
  padding_scale: 1.0
  max_update_rate: 8.0
  filtered_cloud_topic: /camera/depth/filtered_points
